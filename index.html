<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>哑舍 YASHE · 小红书运营中枢</title>
<style>
:root {
  --bg: #faf8f5; --bg2: #f3efe9; --card: #fffdf9; --text: #3a3226; --text2: #6b5e4a;
  --accent: #8b5e3c; --accent2: #c9a87c; --border: #e5d9c4; --tag-bg: #f0e8d8;
  --shadow: 0 2px 12px rgba(0,0,0,.06); --hover-shadow: 0 8px 30px rgba(0,0,0,.1);
  --modal-bg: #fffdf9; --hero-bg: linear-gradient(135deg,#f5ede0,#ebe3d3);
  --placeholder-bg: linear-gradient(135deg,#e8ddcc,#d9ceb8,#e0d5c0);
  --btn-bg: #fff; --input-bg: #fff;
}
[data-theme="dark"] {
  --bg: #1a1a1f; --bg2: #222228; --card: #282830; --text: #e0dcd4; --text2: #a09888;
  --accent: #c9a87c; --accent2: #8b6b4a; --border: #3a3530; --tag-bg: #333028;
  --shadow: 0 2px 12px rgba(0,0,0,.25); --hover-shadow: 0 8px 30px rgba(0,0,0,.4);
  --modal-bg: #282830; --hero-bg: linear-gradient(135deg,#2a2824,#22201c);
  --placeholder-bg: linear-gradient(135deg,#3a3530,#2e2a26);
  --btn-bg: #333; --input-bg: #333;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.container{max-width:1400px;margin:0 auto;padding:0 20px}
.hero{background:var(--hero-bg);padding:40px 20px 30px;text-align:center;border-bottom:1px solid var(--border)}
.hero h1{font-size:clamp(22px,4vw,32px);font-weight:700;color:var(--accent);letter-spacing:4px;margin-bottom:6px}
.hero .tagline{font-size:14px;color:var(--text2);letter-spacing:2px}
.hero .stats{display:flex;justify-content:center;gap:30px;margin-top:16px;flex-wrap:wrap}
.hero .stat{text-align:center}
.hero .stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.hero .stat-label{font-size:11px;color:var(--text2)}
.tab-nav{display:flex;flex-wrap:wrap;gap:6px;padding:16px 20px 0;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;background:var(--bg)}
.tab-btn{padding:10px 18px;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}
.tab-btn:hover{color:var(--accent);background:var(--bg2)}
.tab-btn.active{background:var(--card);color:var(--accent);border-color:var(--accent);font-weight:600}
.tab-btn .nb{font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px}
.controls{display:flex;gap:10px;padding:16px 20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--bg2)}
.ctrl-btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px;transition:all .2s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{font-size:16px;padding:6px 10px}
.search-input{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--text);font-size:12px;min-width:200px}
.tab-content{display:none;padding:20px}
.tab-content.active{display:block}
.waterfall{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-flow:dense;gap:16px}
@media(min-width:1200px){.waterfall{grid-template-columns:repeat(4,1fr)}}
@media(max-width:768px){.waterfall{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.waterfall{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;cursor:pointer;break-inside:avoid;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:var(--hover-shadow)}
.card-img{width:100%;aspect-ratio:4/3;object-fit:cover;background:var(--placeholder-bg);display:block}
.card-body{padding:14px;flex:1;display:flex;flex-direction:column}
.card-title{font-size:14px;font-weight:600;color:var(--accent);margin-bottom:4px;line-height:1.4}
.card-slogan{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.4}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--tag-bg);color:var(--text2);white-space:nowrap}
.tag.highlight{background:var(--accent);color:#fff}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:999;justify-content:center;align-items:center;padding:20px}
.modal-overlay.show{display:flex}
.modal{background:var(--modal-bg);border-radius:16px;max-width:620px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal-header{padding:20px 24px 12px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:flex-start}
.modal-header h3{font-size:18px;color:var(--accent)}
.modal-close{background:none;border:none;font-size:24px;color:var(--text2);cursor:pointer;line-height:1;padding:0 4px}
.modal-close:hover{color:var(--accent)}
.modal-body{padding:20px 24px;font-size:13px;line-height:1.8;white-space:pre-wrap}
.modal-body b,.modal-body strong{color:var(--accent)}
.section-title{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--accent2);display:flex;align-items:center;gap:8px}
.section-title .count{font-size:13px;font-weight:400;color:var(--text2)}
.compete-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px}
.compete-table th{background:var(--bg2);padding:10px 12px;text-align:left;font-weight:600;color:var(--accent);border-bottom:2px solid var(--border)}
.compete-table td{padding:10px 12px;border-bottom:1px solid var(--border)}
.compete-table tr:hover{background:var(--bg2)}
.compete-table a{color:var(--accent);text-decoration:none}
.compete-table a:hover{text-decoration:underline}
.ai-chat{display:flex;flex-direction:column;gap:12px;max-height:400px;overflow-y:auto;margin-bottom:12px}
.ai-msg{max-width:85%;padding:12px 16px;border-radius:12px;font-size:13px;line-height:1.6}
.ai-msg.user{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:4px}
.ai-msg.bot{align-self:flex-start;background:var(--bg2);color:var(--text);border-bottom-left-radius:4px}
.ai-msg a{color:inherit;text-decoration:underline}
.ai-input-row{display:flex;gap:8px}
.ai-input-row input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:8px;background:var(--input-bg);color:var(--text);font-size:13px}
.quick-asks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.quick-btn{font-size:11px;padding:6px 12px;border:1px solid var(--border);border-radius:20px;background:var(--btn-bg);color:var(--text2);cursor:pointer;transition:all .2s}
.quick-btn:hover{border-color:var(--accent);color:var(--accent)}
.load-more{text-align:center;padding:20px}
.load-more button{padding:10px 30px;border:1px solid var(--accent);border-radius:20px;background:transparent;color:var(--accent);cursor:pointer;font-size:13px;transition:all .2s}
.load-more button:hover{background:var(--accent);color:#fff}
.filter-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.filter-tag{font-size:11px;padding:5px 12px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--text2);cursor:pointer;transition:all .2s}
.filter-tag:hover,.filter-tag.active{border-color:var(--accent);color:var(--accent);background:var(--tag-bg)}
.gradient-placeholder{width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:12px;color:var(--text2)}
</style></head>
