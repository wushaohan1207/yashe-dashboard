[data-theme="dark"] {

  --accent: #c9a87c; --accent2: #8b6b4a; --border: #3a3530; --tag-bg: #333028;

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}

.hero h1{font-size:clamp(22px,4vw,32px);font-weight:700;color:var(--accent);letter-spacing:4px;margin-bottom:6px}
.hero .tagline{font-size:14px;color:var(--text2);letter-spacing:2px}
.hero .stats{display:flex;justify-content:center;gap:30px;margin-top:16px;flex-wrap:wrap}
.hero .stat{text-align:center}
.hero .stat-num{font-size:22px;font-weight:700;color:var(--accent)}
.hero .stat-label{font-size:11px;color:var(--text2)}

.tab-btn{padding:10px 18px;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;background:transparent;color:var(--text2);cursor:pointer;font-size:13px;transition:all .2s}
.tab-btn:hover{color:var(--accent);background:var(--bg2)}
.tab-btn.active{background:var(--card);color:var(--accent);border-color:var(--accent);font-weight:600}
.tab-btn .nb{font-size:9px;background:var(--accent);color:#fff;padding:1px 5px;border-radius:3px;margin-left:4px}
.controls{display:flex;gap:10px;padding:16px 20px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);background:var(--bg2)}
.ctrl-btn{padding:8px 16px;border:1px solid var(--border);border-radius:6px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:12px;transition:all .2s}
.ctrl-btn:hover{border-color:var(--accent);color:var(--accent)}
.theme-toggle{font-size:16px;padding:6px 10px}
.search-row{display:flex;gap:6px;align-items:center}
.search-input{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--input-bg);color:var(--text);font-size:12px;min-width:200px}
.search-btn{padding:8px 14px;border:1px solid var(--border);border-radius:6px;background:var(--btn-bg);color:var(--text);cursor:pointer;font-size:14px;transition:all .2s}
.search-btn:hover{border-color:var(--accent);color:var(--accent)}
.tab-content{display:none;padding:20px}
.tab-content.active{display:block}
.waterfall{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));grid-auto-flow:dense;gap:16px}

@media(max-width:768px){.waterfall{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.waterfall{grid-template-columns:1fr}}
.card{background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,box-shadow .2s;cursor:pointer;break-inside:avoid;display:flex;flex-direction:column}

.card-slogan{font-size:12px;color:var(--text2);margin-bottom:8px;line-height:1.4}
.card-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:auto}
.tag{font-size:10px;padding:3px 8px;border-radius:4px;background:var(--tag-bg);color:var(--text2);white-space:nowrap}
.tag.highlight{background:var(--accent);color:#fff}
.inspo-link{text-decoration:none;color:inherit;display:block}
.inspo-link:hover{color:inherit}
.modal-overlay{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.55);z-index:999;justify-content:center;align-items:center;padding:20px}

.modal{background:var(--modal-bg);border-radius:16px;max-width:700px;width:100%;max-height:85vh;overflow-y:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}

.modal-close:hover{color:var(--accent)}
.modal-body{padding:20px 24px;font-size:13px;line-height:1.8}
.modal-body b,.modal-body strong{color:var(--accent)}

.modal-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:13px}
.modal-table td{padding:8px 12px;border-bottom:1px solid var(--border)}

.section-title{font-size:20px;font-weight:700;color:var(--accent);margin-bottom:14px;padding-bottom:8px;border-bottom:2px solid var(--accent2);display:flex;align-items:center;gap:8px}

.compete-table{width:100%;border-collapse:collapse;margin-bottom:20px;font-size:13px}
.compete-table th{background:var(--bg2);padding:10px 12px;text-align:left;font-weight:600;color:var(--accent);border-bottom:2px solid var(--border)}

.ai-chat{display:flex;flex-direction:column;gap:12px;max-height:400px;overflow-y:auto;margin-bottom:12px}

.account-dashboard{max-width:800px}

if(p.img){imgEl.src=p.img;imgEl.style.display="block";}else{imgEl.style.display="none";}
document.getElementById("modalBody").innerHTML='<p style="font-size:15px;font-weight:600;color:var(--accent);margin-bottom:8px">'+p.slogan+'</p><p style="font-size:12px;color:var(--text2);margin-bottom:12px">'+(p.tags||[]).map(function(t){return "#"+t;}).join(" ")+'</p><hr style="border-color:var(--border);margin:12px 0"><table class="modal-table"><tr><td>定价</td><td>'+(p.price||"-")+'</td></tr><tr><td>材质</td><td>'+(p.material||"-")+'</td></tr><tr><td>工艺</td><td>'+(p.craft||"-")+'</td></tr><tr><td>人群</td><td>'+(p.audience||"-")+'</td></tr><tr><td>场景</td><td>'+(p.usage||"-")+'</td></tr><tr><td>气味</td><td>'+(p.scent||"-")+'</td></tr></table><hr style="border-color:var(--border);margin:12px 0"><p>'+((p.desc||"").replace(/\n/g,"<br>"))+"</p>";
document.getElementById("modalOverlay").classList.add("show");document.body.style.overflow="hidden";
}

function closeModal(){document.getElementById("modalOverlay").classList.remove("show");document.body.style.overflow="";}
document.getElementById("modalOverlay").addEventListener("click",function(e){if(e.target===this)closeModal();});

function switchTab(tab){
currentTab=tab;
document.querySelectorAll(".tab-btn").forEach(function(b){b.classList.remove("active");});
var btnEl=document.querySelector('.tab-btn[onclick="switchTab(\''+tab+'\')"]');
if(btnEl)btnEl.classList.add("active");
document.querySelectorAll(".tab-content").forEach(function(c){c.classList.remove("active");});
document.getElementById("tab-"+tab).classList.add("active");
if(tab==="compete")renderCompete();
if(tab==="hot")renderHot();
if(tab==="ai")renderAI();
if(tab==="account")renderAccount();
if(tab==="products"){document.getElementById("productSearchInfo").innerHTML="";renderProducts();}
}

function refreshCurrent(){
var btn=document.getElementById("refreshBtn");
btn.classList.add("spin");
setTimeout(function(){btn.classList.remove("spin");},500);
if(currentTab==="inspo"){inspoPage=1;currentSearch="";document.getElementById("inspoSearchInfo").innerHTML="";renderInspo();document.getElementById("searchBox").value="";}
if(currentTab==="compete")renderCompete();
if(currentTab==="hot")renderHot();
if(currentTab==="ai")renderAI();
if(currentTab==="account")renderAccount();
if(currentTab==="products"){currentSearch="";document.getElementById("productSearchInfo").innerHTML="";renderProducts();document.getElementById("searchBox").value="";}
}

function toggleTheme(){
theme=theme==="light"?"dark":"light";
document.documentElement.setAttribute("data-theme",theme);
document.getElementById("themeBtn").textContent=theme==="light"?"\u263D":"\u2600";
localStorage.setItem("yashe-theme",theme);
}

function doSearch(){
var q=document.getElementById("searchBox").value.trim();
if(!q||q.length<2){
currentSearch="";
clearSearchResults();
if(currentTab==="inspo"){inspoPage=1;renderInspo();}
if(currentTab==="compete")renderCompete();
if(currentTab==="products"){renderProducts();document.getElementById("productFilters").innerHTML=[{l:"全部",v:"all"},{l:"念系列",v:"念"},{l:"融系列",v:"融"},{l:"十二星次",v:"十二星次"}].map(function(f){return '<button class="filter-tag'+(activeProductFilter===f.v?" active":"")+'" onclick="filterProducts(\''+f.v+'\')">'+f.l+"</button>";}).join("");}
return;
}
currentSearch=q;
// Search products
var allProd=[];for(var s in window.PRODUCTS){window.PRODUCTS[s].forEach(function(p,i){allProd.push({name:p.name,slogan:p.slogan,tags:p.tags,desc:p.desc,series:s,idx:i,img:p.img,price:p.price,material:p.material,craft:p.craft,audience:p.audience,usage:p.usage,scent:p.scent});});}
var prods=allProd.filter(function(p){return p.name.indexOf(q)>=0||p.slogan.indexOf(q)>=0||(p.desc||"").indexOf(q)>=0||(p.material||"").indexOf(q)>=0||p.series.indexOf(q)>=0;});
// Search competitors
var comps=[];["direct","indirect"].forEach(function(t){window.COMPETITORS[t].forEach(function(c){if(c.brand.indexOf(q)>=0)comps.push({brand:c.brand,type:t});});});
// Search inspiration
var inspos=window.INSPIRATION.filter(function(i){return i.title.indexOf(q)>=0||(i.tag||"").indexOf(q)>=0;});

if(prods.length>0){
switchTab("products");
document.getElementById("productSearchInfo").innerHTML='<div class="search-result-info">搜索「'+q+'」找到 <b>'+prods.length+'</b> 款产品</div>';
var groups={};prods.forEach(function(p){if(!groups[p.series])groups[p.series]=[];groups[p.series].push(p);});
var h="";for(var g in groups){h+='<div class="section-title">'+g+'<span class="count">('+groups[g].length+'款)</span></div>';h+='<div class="waterfall" style="margin-bottom:24px">';groups[g].forEach(function(p){p._pid="prod_s_"+p.series+"_"+p.idx;h+=makeCard({title:p.name,slogan:p.slogan,tags:p.tags,img:p.img,onclick:"openProductModal('"+p._pid+"')"});});h+="</div>";}
document.getElementById("productGrid").innerHTML=h;
document.getElementById("productFilters").innerHTML='<button class="filter-tag" onclick="clearSearchResults();renderProducts();document.getElementById(\'searchBox\').value=\'\'">清除搜索</button>';
}else if(comps.length>0){
switchTab("compete");
document.getElementById("competeSearchInfo").innerHTML='<div class="search-result-info">搜索「'+q+'」找到 <b>'+comps.length+'</b> 个竞品品牌 <a onclick="clearSearchResults();renderCompete()">清除</a></div>';
renderCompete(comps[0].brand);
}else if(inspos.length>0){
switchTab("inspo");
document.getElementById("inspoSearchInfo").innerHTML='<div class="search-result-info">搜索「'+q+'」找到 <b>'+inspos.length+'</b> 条灵感 <a onclick="clearSearchResults();inspoPage=1;renderInspo()">清除</a></div>';
inspoPage=1;renderInspo(inspos);
}else{
document.getElementById("productGrid").innerHTML='<p style="color:var(--text2);text-align:center;padding:40px">未找到匹配「'+q+'」的结果</p>';
}
}

function clearSearchResults(){
document.getElementById("inspoSearchInfo").innerHTML="";
document.getElementById("competeSearchInfo").innerHTML="";
document.getElementById("productSearchInfo").innerHTML="";
currentSearch="";
}

document.documentElement.setAttribute("data-theme",theme);document.getElementById("themeBtn").textContent=theme==="light"?"\u263D":"\u2600";renderInspo();
</script>
